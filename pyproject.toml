[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4ckd-repro"
version = "0.1.0"
description = "Reproducibility scaffold for LLM4CKD experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "tqdm>=4.66"
]

[tool.setuptools.packages.find]
where = ["src"]
